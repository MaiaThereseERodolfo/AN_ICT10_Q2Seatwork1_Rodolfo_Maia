<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

	<style>
		body{
			background-color: #f8e1bd;
		}
		.img-fluid{
			width: 100%;
			height:100%;
		}
		input{
			border: 1px solid #ccc;
			border-radius: 10px;
			font-size: 15px;
            width: 50%;
			padding: 5px;
			margin-bottom: 15px;
            background-color: white;
		}
		.btn{
			background-color: #4980b3;
			border: 1px solid #1e1e1e;
		}
	</style>
</head>
	<body class="container mt-5 mb-5">
		<img class="img-fluid" src="bg.png">
		<br><br>
		<h1>Book Club Checker</h1>
		<p>candidate verification system</p>
	
		<input type="text" id="first_name" class="mb-3" placeholder="Enter your first name!">
		<br>
		<input type="text" id="last_name" class="mb-3" placeholder="Enter your second name!">
		<br>
		<button type="button" class="btn" py-click="check">CHECK</button>
	
		<p id="message"></p>
	
		<py-script src="main.py"></py-script>
	
</body>
</html>
